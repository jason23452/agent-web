<!doctype html>
<html lang="zh-Hant-TW"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AICaht · OpenCode Agent 原型</title>
  <style>
    :root {
      --bg: oklch(97.6% 0 0);
      --surface: oklch(100% 0 0);
      --fg: oklch(17% 0 0);
      --muted: oklch(58% 0 0);
      --border: oklch(91.5% 0 0);
      --accent: oklch(18% 0 0);
      --accent-on: oklch(100% 0 0);
      --success: oklch(58% 0.15 145);
      --warn: oklch(74% 0.15 86);
      --danger: oklch(57% 0.2 28);

      --accent-soft: color-mix(in oklch, var(--accent) 7%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
      --surface-soft: color-mix(in oklch, var(--surface) 82%, var(--bg));
      --border-soft: color-mix(in oklch, var(--border) 62%, transparent);
      --success-soft: color-mix(in oklch, var(--success) 13%, transparent);
      --warn-soft: color-mix(in oklch, var(--warn) 20%, transparent);

      --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 20px;
      --text-xl: 24px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --shadow-raised: 0 14px 40px color-mix(in oklch, var(--fg) 10%, transparent);
      --shadow-soft: 0 2px 10px color-mix(in oklch, var(--fg) 8%, transparent);
      --focus-ring: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);

      /* context ring states */
      --ring-normal: var(--accent);
      --ring-warn: var(--warn);
      --ring-full: var(--danger);
      --ring-track: var(--fg-soft);
      --context-pct: 72;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    p, h1, h2, h3 { margin: 0; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 332px;
      background: var(--bg);
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 34%, var(--bg));
      padding: 18px 10px 14px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      gap: 14px;
    }

    .brand-row,
    .sidebar-footer,
    .topbar,
    .panel-head,
    .composer-toolbar,
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 650;
      letter-spacing: -0.02em;
      font-size: 18px;
      padding-inline: 8px;
    }

    .icon-button,
    .tool-button,
    .send-button {
      border: 0;
      min-width: 40px;
      min-height: 40px;
      border-radius: var(--radius-pill);
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: var(--fg);
      transition: background 160ms ease, transform 80ms ease, color 160ms ease;
    }

    .icon-button:hover,
    .tool-button:hover { background: var(--fg-soft); }
    .icon-button:active,
    .tool-button:active,
    .send-button:active { transform: translateY(1px); }
    .icon-button:focus-visible,
    .tool-button:focus-visible,
    .send-button:focus-visible,
    .nav-item:focus-visible,
    .session-item:focus-visible,
    .segmented button:focus-visible,
    .panel-tab:focus-visible,
    textarea:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .nav-list,
    .session-list,
    .status-list,
    .file-list,
    .tool-log { list-style: none; padding: 0; margin: 0; }

    .nav-list { display: grid; gap: 3px; }
    .nav-item,
    .session-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--fg);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      text-align: left;
      transition: background 160ms ease;
    }
    .nav-item:hover,
    .session-item:hover { background: var(--fg-soft); }
    .nav-item.is-active,
    .session-item.is-active { background: var(--accent-soft); }
    .nav-item span:first-child { width: 20px; display: inline-grid; place-items: center; }

    .sidebar-section-title {
      font-size: var(--text-xs);
      font-weight: 700;
      margin: 18px 8px 8px;
      color: var(--fg);
    }

    .session-list {
      display: grid;
      gap: 2px;
      overflow: auto;
      padding-right: 4px;
    }
    .session-item {
      align-items: flex-start;
      flex-direction: column;
      gap: 1px;
      padding-block: 8px;
    }
    .session-title {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--text-sm);
    }
    .session-meta {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid var(--border-soft);
      padding: 12px 8px 0;
      justify-content: flex-start;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      background: var(--fg-soft);
      font-weight: 700;
      font-size: var(--text-xs);
    }
    .profile-copy { display: grid; gap: 0; }
    .profile-copy strong { font-size: var(--text-sm); font-weight: 600; }
    .profile-copy span { font-size: var(--text-xs); color: var(--muted); }

    .chat-area {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--surface);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 64px;
      padding: 12px 24px;
      background: color-mix(in oklch, var(--surface) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mobile-menu { display: none; }
    .segmented {
      display: inline-flex;
      padding: 4px;
      background: var(--fg-soft);
      border-radius: var(--radius-pill);
      gap: 2px;
    }
    .segmented button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-width: 92px;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-weight: 600;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }
    .segmented button.is-active {
      color: var(--fg);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .agent-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 7px 12px;
      color: var(--muted);
      font-size: var(--text-sm);
      background: var(--surface);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--muted);
    }
    .dot.is-live { background: var(--success); box-shadow: 0 0 0 4px var(--success-soft); }
    .dot.is-waiting { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }

    .chat-scroll {
      min-height: 0;
      overflow: auto;
      padding: 72px clamp(18px, 5vw, 64px) 24px;
    }
    .chat-stage {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }
    .welcome {
      min-height: 210px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      gap: 22px;
    }
    .welcome h1 {
      font-family: var(--font-display);
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.025em;
      font-weight: 600;
    }
    .welcome p { color: var(--muted); max-width: 54ch; }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, 720px);
    }
    .quick-action {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: left;
      transition: border-color 160ms ease, transform 80ms ease, background 160ms ease;
    }
    .quick-action:hover { border-color: color-mix(in oklch, var(--fg) 22%, var(--border)); background: var(--surface-soft); }
    .quick-action:active { transform: translateY(1px); }
    .quick-action strong { display: block; font-size: var(--text-sm); margin-bottom: 3px; }
    .quick-action span { color: var(--muted); font-size: var(--text-xs); }

    .message-list {
      display: grid;
      gap: 22px;
    }
    .message {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      background: var(--fg-soft);
      font-weight: 700;
      font-size: var(--text-xs);
    }
    .message.is-agent .message-avatar { background: var(--accent); color: var(--accent-on); }
    .message-card {
      padding-top: 12px;
      display: grid;
      gap: 10px;
      min-width: 0;
      position: relative;
    }
    .msg-pin-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      border: 0;
      background: transparent;
      color: var(--accent);
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 1;
      transition: color 120ms ease, background 120ms ease;
      padding: 0;
      z-index: 2;
    }
    .msg-pin-btn:hover { color: var(--accent); background: var(--accent-soft); }
    .msg-pin-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .msg-pin-btn svg { width: 14px; height: 14px; }
    .message-card h2 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      letter-spacing: -0.015em;
      line-height: 1.25;
      font-weight: 650;
    }
    .message-card p { color: var(--fg); }
    .message-card .muted { color: var(--muted); }
    .plan-box {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .plan-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      font-size: var(--text-sm);
    }
    .plan-index {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 8px;
      font-size: var(--text-xs);
      color: var(--muted);
      background: var(--surface);
      white-space: nowrap;
    }
    .status-pill.is-running { color: var(--fg); }
    .status-pill.is-done { color: var(--success); border-color: color-mix(in oklch, var(--success) 35%, var(--border)); }

    .composer-wrap {
      padding: 14px clamp(18px, 5vw, 64px) 24px;
      background: linear-gradient(to top, var(--surface) 78%, color-mix(in oklch, var(--surface) 0%, transparent));
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow-raised);
      padding: 8px 8px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color 160ms ease;
    }
    .composer:focus-within { border-color: color-mix(in oklch, var(--accent) 35%, var(--border)); }
    .composer-input-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
    }
    .composer-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 0 8px 0;
      min-height: 0;
    }
    .composer-preview:empty { display: none; padding: 0; }
    .composer textarea {
      resize: none;
      border: 0;
      outline: 0;
      min-height: 44px;
      max-height: 140px;
      padding: 11px 4px;
      color: var(--fg);
      background: transparent;
      line-height: 1.45;
    }
    .composer textarea::placeholder { color: color-mix(in oklch, var(--muted) 70%, transparent); }
    .composer-actions { display: flex; align-items: center; gap: 4px; }
    .send-button {
      background: var(--accent);
      color: var(--accent-on);
      min-width: 44px;
      min-height: 44px;
    }
    .send-button[disabled] { opacity: 0.35; cursor: not-allowed; }
    .composer-hint {
      max-width: 820px;
      margin: 8px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: var(--text-xs);
    }

    .context-panel {
      border-left: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 70%, var(--bg));
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-width: 0;
    }

    /* ─── Panel head ──────────────────────────────── */
    .panel-head {
      height: 64px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-head h2 {
      font-size: var(--text-base);
      font-weight: 650;
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .panel-head .back-btn {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--fg);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .panel-head .back-btn:hover { background: var(--fg-soft); }
    .panel-head .back-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .panel-head .back-btn[hidden] { display: none; }

    /* ─── Panel tabs ──────────────────────────────── */
    .panel-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
    }
    .panel-tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
      font-size: var(--text-sm);
      font-weight: 600;
      transition: background 140ms ease, color 140ms ease;
    }
    .panel-tab:hover { color: var(--fg); }
    .panel-tab.is-active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-soft); }
    .panel-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* ─── Panel body ──────────────────────────────── */
    .panel-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 2px;
    }

    /* ─── Edit Agent ──────────────────────────────── */
    .edit-agent-view {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      height: 100%;
      padding: 0;
      gap: 0;
    }
    .edit-agent-header {
      padding: 8px 10px 14px;
      border-bottom: 1px solid var(--border-soft);
      display: grid;
      gap: 4px;
    }
    .edit-agent-header h3 {
      font-size: var(--text-sm);
      font-weight: 650;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .edit-agent-header h3 .badge {
      font-size: 10px;
      font-weight: 600;
      background: color-mix(in oklch, var(--accent) 12%, transparent);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: var(--radius-pill, 20px);
      letter-spacing: 0;
    }
    .edit-agent-header p {
      font-size: var(--text-xs);
      color: var(--muted);
      line-height: 1.4;
    }
    .edit-agent-body {
      overflow: auto;
      padding: 12px 10px;
      display: grid;
      align-content: start;
      gap: 10px;
    }
    .edit-agent-body .edit-prompt-card,
    .edit-agent-body .edit-response-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: grid;
      gap: 6px;
    }
    .edit-agent-body .edit-response-card {
      border-left: 3px solid var(--accent);
    }
    .edit-agent-body .edit-response-card .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .edit-agent-body .edit-response-card .content {
      font-size: var(--text-sm);
      line-height: 1.6;
      color: var(--fg);
    }
    .edit-agent-body .edit-prompt-card .prompt-text {
      font-size: var(--text-sm);
      line-height: 1.5;
      color: var(--fg);
    }
    .edit-agent-body .edit-prompt-card .prompt-meta {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .edit-agent-foot {
      padding: 10px;
      border-top: 1px solid var(--border-soft);
      background: color-mix(in oklch, var(--bg) 40%, var(--surface));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .edit-agent-foot .edit-input {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      font-size: var(--text-sm);
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 38px;
      max-height: 100px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .edit-agent-foot .edit-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 15%, transparent);
    }
    .edit-agent-foot .edit-input::placeholder { color: color-mix(in oklch, var(--muted) 50%, transparent); }
    .edit-agent-foot .edit-send {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 0;
      background: var(--accent);
      color: var(--accent-on);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 140ms ease, transform 100ms ease;
    }
    .edit-agent-foot .edit-send:hover { opacity: 0.9; }
    .edit-agent-foot .edit-send:active { transform: scale(0.94); }
    .edit-agent-foot .edit-send:disabled { opacity: 0.35; cursor: default; }
    .edit-agent-foot .edit-send:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .edit-empty-state {
      display: grid;
      place-items: center;
      gap: 10px;
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .edit-empty-state svg { width: 28px; height: 28px; opacity: 0.3; }
    .edit-streaming {
      display: flex;
      gap: 4px;
      padding: 2px 0;
    }
    .edit-streaming span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: editDotPulse 1s ease infinite;
    }
    .edit-streaming span:nth-child(2) { animation-delay: 0.15s; }
    .edit-streaming span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes editDotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .tree-root {
      padding: 2px 0;
    }
    .tree-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 0;
      border-radius: var(--radius-sm);
      cursor: default;
      border: 0;
      background: transparent;
      color: var(--fg);
      text-align: left;
      width: 100%;
      min-height: 32px;
      transition: background 100ms ease;
      position: relative;
    }
    .tree-node:hover { background: var(--fg-soft); }
    .tree-node:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .tree-node.is-selected { background: color-mix(in oklch, var(--accent) 8%, transparent); }

    .tree-node .tree-toggle {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      color: color-mix(in oklch, var(--muted) 40%, transparent);
      transition: transform 160ms ease, color 160ms ease;
      cursor: pointer;
      border: 0;
      background: transparent;
      padding: 0;
    }
    .tree-node .tree-toggle:hover { color: var(--muted); }
    .tree-node .tree-toggle.is-expanded { transform: rotate(90deg); }
    .tree-node .tree-toggle.is-hidden { visibility: hidden; pointer-events: none; }

    .tree-node .tree-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      font-size: 12px;
    }
    .tree-node .tree-icon.is-folder {
      color: var(--warn);
    }
    .tree-node .tree-icon.is-file {
      color: var(--muted);
    }
    .tree-node .tree-icon.is-img {
      color: var(--accent);
    }

    .tree-node .tree-label {
      flex: 1;
      min-width: 0;
      font-size: var(--text-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      line-height: 1.3;
    }
    .tree-node .tree-meta {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .tree-node:hover .tree-meta { opacity: 1; }

    .tree-children { display: none; }
    .tree-children.is-open { display: block; }

    /* ─── Preview popup overlay ──────────────────────── */
    .preview-popup {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      animation: popupFadeIn 180ms ease both;
    }
    .preview-popup[hidden] { display: none; }
    @keyframes popupFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popupSlideUp { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .popup-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.38);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .popup-dialog {
      position: relative;
      width: min(720px, 94vw);
      max-height: 88vh;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 12px 52px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.05);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      animation: popupSlideUp 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .popup-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-soft);
      min-height: 54px;
    }
    .popup-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .popup-title-icon {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      background: var(--fg-soft); color: var(--muted);
    }
    .popup-title-icon.is-img { background: color-mix(in oklch, var(--accent) 10%, transparent); color: var(--accent); }
    .popup-filename {
      font-weight: 640; font-size: var(--text-base); letter-spacing: -0.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .popup-filemeta { flex-shrink: 0; font-size: var(--text-xs); color: var(--muted); font-family: var(--font-mono); }
    .popup-header-actions { display: flex; align-items: center; gap: 6px; }
    .popup-action-btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--fg);
      border-radius: 8px; padding: 7px 14px; font-size: var(--text-sm);
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .popup-action-btn:hover { border-color: color-mix(in oklch, var(--fg) 18%, var(--border)); background: var(--surface-soft); }
    .popup-action-btn.is-primary { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
    .popup-pin-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; }
    .popup-pin-btn svg { flex-shrink: 0; }
    .popup-pin-btn.is-pinned { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in oklch, var(--accent) 25%, transparent); }
    .popup-action-btn.is-primary:hover { background: var(--accent-hover, var(--accent)); }
    .popup-action-btn.popup-close { border: 0; background: transparent; padding: 0; width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); font-size: 18px; border-radius: 8px; }
    .popup-action-btn.popup-close:hover { color: var(--fg); background: var(--fg-soft); border: 0; }
    .popup-action-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .popup-body {
      overflow: auto;
      padding: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      position: relative;
    }

    /* ─── Popup Edit Agent (primary) ─────────────────── */
    .popup-agent-area {
      padding: 14px 20px 10px;
      display: grid;
      gap: 12px;
      align-content: start;
      background: var(--surface);
    }
    .popup-agent-context {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      padding: 2px 0;
      letter-spacing: 0.01em;
    }
    .popup-agent-context svg { flex-shrink: 0; opacity: 0.65; }
    .dialog-pin-icon {
      flex-shrink: 0;
      margin-left: auto;
      border: 0;
      background: transparent;
      color: var(--accent);
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color 120ms ease, background 120ms ease, opacity 120ms ease;
      opacity: 0.8;
    }
    .dialog-pin-icon:hover { color: var(--accent); background: var(--accent-soft); opacity: 1; }
    .dialog-pin-icon:focus-visible { outline: none; box-shadow: var(--focus-ring); opacity: 1; }
    .popup-agent-response {
      display: grid;
      gap: 6px;
      padding: 12px 14px;
      background: color-mix(in oklch, var(--accent) 5%, transparent);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      max-height: 220px;
      overflow: auto;
    }
    .popup-agent-response[hidden] { display: none; }
    .popup-agent-response-label {
      font-size: 9px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .popup-agent-response-content {
      font-size: 13px; line-height: 1.7; color: var(--fg);
      white-space: pre-wrap;
    }

    .popup-agent-input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .popup-agent-input {
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.55;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .popup-agent-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 12%, transparent);
    }
    .popup-agent-input::placeholder { color: color-mix(in oklch, var(--muted) 40%, transparent); }
    .popup-agent-send {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: var(--accent-on);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 140ms ease, transform 100ms ease, background 140ms ease;
    }
    .popup-agent-send:hover { opacity: 0.9; }
    .popup-agent-send:active { transform: scale(0.92); }
    .popup-agent-send:disabled { opacity: 0.25; cursor: default; }
    .popup-agent-send:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .popup-agent-stream {
      display: flex;
      gap: 5px;
      padding: 4px 0;
    }
    .popup-agent-stream span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: agentDotPulse 1s ease infinite;
    }
    .popup-agent-stream span:nth-child(2) { animation-delay: 0.15s; }
    .popup-agent-stream span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes agentDotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ─── Popup preview (secondary collapsible) ──────── */
    .popup-preview-collapse {
      border-top: 1px solid var(--border-soft);
      display: grid;
      grid-template-rows: auto 0fr;
      transition: grid-template-rows 300ms cubic-bezier(0.22, 1, 0.36, 1);
      background: #1e1e1e;
      position: relative;
    }
    .popup-preview-collapse.is-open { grid-template-rows: auto 1fr; }

    .popup-preview-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 20px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      user-select: none;
      transition: color 120ms ease;
      background: #1e1e1e;
    }
    .popup-preview-bar:hover { color: rgba(255,255,255,0.85); }
    .popup-preview-bar svg {
      transition: transform 180ms ease;
    }
    .popup-preview-collapse.is-open .popup-preview-bar svg { transform: rotate(90deg); }

    .popup-preview-area {
      overflow: auto;
      min-height: 0;
      padding: 0 20px 14px;
      background: #1e1e1e;
    }
    .popup-preview-area pre {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
      font-family: var(--font-mono);
      white-space: pre-wrap;
      word-break: break-all;
      color: #d4d4d4;
      counter-reset: line;
    }
    .popup-preview-area pre .line {
      display: block;
      counter-increment: line;
      padding-left: 42px;
      position: relative;
    }
    .popup-preview-area pre .line::before {
      content: counter(line);
      position: absolute;
      left: 0;
      width: 32px;
      text-align: right;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      user-select: none;
      pointer-events: none;
    }
    .popup-preview-area img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 8px;
      object-fit: contain;
      background: var(--bg);
    }

    /* ─── Pin float button in preview popup ────────── */
    .pin-float-btn {
      position: absolute;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      background: var(--accent);
      color: var(--accent-on);
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      pointer-events: auto;
      transition: opacity 140ms ease, transform 120ms ease, top 60ms ease, left 60ms ease;
      white-space: nowrap;
      top: 0;
      left: 0;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .pin-float-btn.is-visible { display: inline-flex; }
    .pin-float-btn:hover { opacity: 0.9; }
    .pin-float-btn:active { transform: scale(0.94); }
    .pin-float-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .pin-float-btn svg { flex-shrink: 0; }

    /* ─── Pin preview bar inside composer ─────────── */
    .composer-pinbar {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 260ms cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .composer-pinbar.is-active { grid-template-rows: 1fr; }
    .composer-pinbar-inner {
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 0;
      min-height: 0;
    }
    .composer-pinbar.is-active .composer-pinbar-inner {
      padding: 0 0 10px 0;
    }
    .pin-tag {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      background: color-mix(in oklch, var(--accent) 6%, transparent);
      border: 1px solid color-mix(in oklch, var(--accent) 14%, transparent);
      border-radius: 10px;
      flex: 1;
      min-width: 0;
    }
    .pin-tag-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: color-mix(in oklch, var(--accent) 12%, transparent);
      color: var(--accent);
      margin-top: 1px;
    }
    .pin-tag-icon svg { width: 12px; height: 12px; }
    .pin-tag-body {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 3px;
    }
    .pin-tag-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pin-tag-filename {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pin-tag-lines {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .pin-tag-text {
      font-size: 12px;
      line-height: 1.5;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.78;
    }
    .pin-tag-remove {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: color-mix(in oklch, var(--muted) 40%, transparent);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color 120ms ease, background 120ms ease;
      margin-top: 2px;
    }
    .pin-tag-remove:hover { color: var(--fg); background: var(--fg-soft); }
    .pin-tag-remove svg { width: 14px; height: 14px; }

    .status-list,
    .tool-log { display: grid; gap: 10px; }
    .status-item,
    .tool-item {
      display: grid;
      gap: 3px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }
    .status-item:last-child,
    .tool-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .status-line,
    .tool-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: var(--text-sm);
      color: var(--fg);
      min-width: 0;
    }
    .tool-line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mono { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); }
    .mini-meter {
      height: 6px;
      border-radius: var(--radius-pill);
      background: var(--fg-soft);
      overflow: hidden;
    }
    .mini-meter span {
      display: block;
      height: 100%;
      width: var(--value);
      background: var(--fg);
      border-radius: inherit;
    }

    /* ─── Context ring ──────────────────────────────── */
    .ctx-ring {
      position: relative;
      width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
    }
    .ctx-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ctx-ring .ring-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 2.5;
    }
    .ctx-ring .ring-fill {
      fill: none;
      stroke: var(--ring-color, var(--ring-normal));
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 400ms var(--ease-standard, ease),
                  stroke 250ms ease;
    }
    .ctx-ring .ring-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: var(--radius-pill);
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-soft);
      transition: background 250ms ease, box-shadow 250ms ease;
    }
    .ctx-ring.is-warn .ring-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
    .ctx-ring.is-full .ring-dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in oklch, var(--danger) 18%, transparent); }
    .ctx-ring.is-full .ring-fill { stroke: var(--ring-full); }
    .ctx-ring.is-warn .ring-fill { stroke: var(--ring-warn); }

    /* ─── Token popover ─────────────────────────────── */
    .token-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 25;
      width: 288px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--fg);
      box-shadow: var(--shadow-raised);
      font-size: var(--text-sm);
      line-height: 1.45;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .token-popover[hidden] { display: none; }
    .agent-chip:hover .token-popover,
    .agent-chip:focus-within .token-popover {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .token-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .token-popover-header strong { font-size: var(--text-sm); font-weight: 700; }
    .token-popover-header .mono { font-size: 12px; color: var(--muted); }
    .token-row {
      display: grid;
      gap: 4px;
      padding: 10px 0;
    }
    .token-row + .token-row { border-top: 1px solid var(--border-soft); }
    .token-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .token-row-header span:first-child { font-weight: 600; }
    .token-row-header .mono { font-family: var(--font-mono); font-size: 12px; color: var(--fg); }
    .token-bar {
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--fg-soft);
      overflow: hidden;
    }
    .token-bar span {
      display: block;
      height: 100%;
      width: var(--value);
      border-radius: inherit;
      background: var(--bar-color, var(--accent));
      transition: width 300ms ease;
    }
    .token-row.is-warn .token-bar span { --bar-color: var(--warn); }
    .token-row.is-full .token-bar span { --bar-color: var(--danger); }

    .mobile-panel-toggle { display: none; }

    /* ─── Path breadcrumbs ─────────────────────────── */
    .path-bread {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }
    .path-bread .home-icon {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      margin-right: 3px;
      color: color-mix(in oklch, var(--muted) 40%, transparent);
    }
    .path-bread .seg {
      flex-shrink: 0;
      margin-inline: 1px;
      color: color-mix(in oklch, var(--border) 35%, transparent);
      font-size: 14px;
    }
    .path-bread span { overflow: hidden; text-overflow: ellipsis; }
    .path-bread .current {
      color: var(--fg);
      font-weight: 500;
    }

    /* ─── Attachment preview (inside composer) ────── */
    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 6px;
      background: var(--fg-soft);
      border-radius: var(--radius-sm);
      font-size: 12px;
      min-width: 0;
      max-width: 220px;
      line-height: 1.2;
      transition: background 120ms ease;
    }
    .attach-chip:hover { background: color-mix(in oklch, var(--fg) 10%, transparent); }
    .attach-chip-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: grid;
      place-items: center;
      background: color-mix(in oklch, var(--fg) 8%, transparent);
      color: var(--muted);
    }
    .attach-chip-icon.is-img {
      background: color-mix(in oklch, var(--accent) 12%, transparent);
      color: var(--accent);
    }
    .attach-chip-icon svg { width: 13px; height: 13px; }
    .attach-chip-body {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }
    .attach-chip-body .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--fg);
      font-weight: 500;
      font-size: 12px;
    }
    .attach-chip-body .meta {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .attach-remove {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: color-mix(in oklch, var(--muted) 45%, transparent);
      width: 18px;
      height: 18px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
      transition: background 120ms ease, color 120ms ease;
    }
    .attach-remove:hover { background: var(--danger); color: white; }

    /* ─── Upload popover ──────────────────────────── */
    .upload-trigger {
      position: relative;
      display: inline-grid;
    }
    .upload-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      z-index: 25;
      min-width: 200px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .upload-menu[hidden] { display: none; }
    .upload-menu.is-open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .upload-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--fg);
      border-radius: var(--radius-sm);
      padding: 10px 10px;
      text-align: left;
      transition: background 120ms ease;
    }
    .upload-option:hover { background: var(--fg-soft); }
    .upload-option:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .upload-option svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--muted); }
    .upload-option-text { display: grid; gap: 1px; }
    .upload-option-text strong { font-size: var(--text-sm); font-weight: 600; }
    .upload-option-text span { font-size: var(--text-xs); color: var(--muted); }

    /* ─── Agent switcher ──────────────────────────── */
    .agent-switcher {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .agent-select-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px 4px 4px;
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
    }
    .agent-select-btn:hover { background: var(--fg-soft); color: var(--fg); }
    .agent-select-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .agent-select-btn svg:last-child { width: 14px; height: 14px; }

    .agent-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 25;
      min-width: 200px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .agent-dropdown[hidden] { display: none; }
    .agent-dropdown.is-open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .agent-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--fg);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      text-align: left;
      transition: background 120ms ease;
    }
    .agent-option:hover { background: var(--fg-soft); }
    .agent-option:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .agent-option .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
    }
    .agent-option.agent-active { background: var(--accent-soft); font-weight: 600; }
    .agent-option .agent-name { font-size: var(--text-sm); }
    .agent-option .agent-provider { font-size: var(--text-xs); color: var(--muted); margin-left: auto; }

    /* ─── Search bar ──────────────────────────────── */
    .search-bar-wrap {
      padding-inline: 2px;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .search-bar-wrap[hidden] { display: none; }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar input::placeholder { color: color-mix(in oklch, var(--muted) 65%, transparent); }
    .search-toggle { transition: color 160ms ease; }
    .search-toggle.is-active { color: var(--accent); background: var(--accent-soft); }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 240px minmax(0, 1fr); }
      .context-panel {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(360px, 92vw);
        z-index: 20;
        transform: translateX(100%);
        transition: transform 200ms ease;
        box-shadow: -20px 0 50px color-mix(in oklch, var(--fg) 12%, transparent);
      }
      .context-panel.is-open { transform: translateX(0); }
      .mobile-panel-toggle { display: inline-grid; }
    }

    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(300px, 88vw);
        z-index: 30;
        transform: translateX(-100%);
        transition: transform 200ms ease;
        box-shadow: 20px 0 50px color-mix(in oklch, var(--fg) 12%, transparent);
      }
      .sidebar.is-open { transform: translateX(0); }
      .mobile-menu { display: inline-grid; }
      .chat-scroll { padding-top: 34px; }
      .topbar { padding-inline: 12px; gap: 8px; }
      .topbar-left { gap: 8px; }
      .agent-chip { display: none; }
      .segmented button { min-width: 78px; padding-inline: 12px; }
      .path-bread { display: none; }
      .quick-actions { grid-template-columns: 1fr; }
      .message { grid-template-columns: 30px minmax(0, 1fr); }
      .message-avatar { width: 30px; height: 30px; }
      .composer { border-radius: 22px; }
      .composer-input-row { grid-template-columns: minmax(0, 1fr) auto; }
      .upload-trigger { display: none; }
    }
  </style>
</head>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const sidebar = $('#sidebar');
    const contextPanel = $('#contextPanel');
    const promptInput = $('#promptInput');
    const composerForm = $('#composerForm');
    const messageList = $('#messageList');
    const sendButton = $('#sendButton');
    /* ─── Context ring controller ──────────────────── */
    const CIRCUMFERENCE = 2 * Math.PI * 7.5; // 47.124

    function setContextRing(pct) {
      const ring = $('#ctxRing');
      const fill = $('#ringFill');
      const dot = $('#ringDot');
      const label = $('#contextPctLabel');
      if (!fill) return;

      const offset = CIRCUMFERENCE * (1 - Math.min(pct, 100) / 100);
      fill.setAttribute('stroke-dashoffset', offset.toFixed(2));
      if (label) label.textContent = `${Math.round(pct)}%`;

      // aria
      if (ring) ring.setAttribute('aria-valuenow', Math.round(pct));

      // state classes
      const isFull = pct >= 95;
      const isWarn = pct >= 78 && pct < 95;
      ring?.classList.toggle('is-full', isFull);
      ring?.classList.toggle('is-warn', isWarn);
    }

    function setTokenBar(rowId, used, limit) {
      const row = $(`#${rowId}`);
      if (!row) return;
      const pct = limit > 0 ? (used / limit) * 100 : 0;
      const bar = row.querySelector('.token-bar span');
      if (bar) bar.style.setProperty('--value', `${Math.min(pct, 100)}%`);
      const label = row.querySelector('.mono');
      if (label) {
        const fmt = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}K` : String(n);
        label.textContent = `${fmt(used)} / ${fmt(limit)}`;
      }
      row.classList.toggle('is-full', pct >= 95);
      row.classList.toggle('is-warn', pct >= 78 && pct < 95);
    }

    // Init ring with demo values
    setContextRing(72);
    setTokenBar('tokenRow5hr', 144000, 200000);
    setTokenBar('tokenRow1w', 2900000, 7000000);

    function closeMobileSurfaces() {
      sidebar.classList.remove('is-open');
      contextPanel.classList.remove('is-open');
    }

    $('[data-open-sidebar]')?.addEventListener('click', () => sidebar.classList.add('is-open'));
    $('[data-close-sidebar]')?.addEventListener('click', () => sidebar.classList.remove('is-open'));
    $('[data-open-panel]')?.addEventListener('click', () => contextPanel.classList.add('is-open'));
    $('[data-close-panel]')?.addEventListener('click', () => contextPanel.classList.remove('is-open'));

    $$('.session-item').forEach((item) => {
      item.addEventListener('click', () => {
        $$('.session-item').forEach((button) => button.classList.remove('is-active'));
        item.classList.add('is-active');
        closeMobileSurfaces();
      });
    });

    $$('.segmented button').forEach((button) => {
      button.addEventListener('click', () => {
        $$('.segmented button').forEach((tab) => {
          tab.classList.remove('is-active');
          tab.setAttribute('aria-selected', 'false');
        });
        button.classList.add('is-active');
        button.setAttribute('aria-selected', 'true');
        const isWork = button.dataset.mode === 'work';
      });
    });

    /* ─── Render tree ───────────────────────────────── */

        const row = document.createElement('div');
        row.style.cssText = `display:flex;flex-direction:column`;

        const btn = document.createElement('button');
        btn.className = 'tree-node';
        btn.setAttribute('type','button');
        btn.style.paddingLeft = (depth * 18 + 4) + 'px';

        /* chevron toggle */
        const toggle = document.createElement('span');
        toggle.className = 'tree-toggle' + (isFolder && node.expanded ? ' is-expanded' : '') + (!isFolder ? ' is-hidden' : '');
        toggle.innerHTML = chevronHtml();
        if (isFolder) {
          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            node.expanded = !node.expanded;
            renderLibrary();
          });
        }

        /* icon */
        const icon = document.createElement('span');
        let iconCls = 'tree-icon';
        if (isFolder) iconCls += ' is-folder';
        else if (node.type === 'img') iconCls += ' is-img';
        else iconCls += ' is-file';
        const iconType = isFolder ? (node.expanded ? 'folder-open' : 'folder') : node.type;
        icon.innerHTML = fileIconHtml(iconType);
        icon.className = iconCls;

        /* label */
        const label = document.createElement('span');
        label.className = 'tree-label';
        label.textContent = node.name;

        /* meta */
        const meta = document.createElement('span');
        meta.className = 'tree-meta';
        meta.textContent = isFolder ? '' : (node.size || '');

        btn.append(toggle, icon, label, meta);
        row.append(btn);

        if (!isFolder) {
          btn.addEventListener('click', () => { openPreview(node); });
        } else {
          btn.addEventListener('click', () => {
            node.expanded = !node.expanded;
            renderLibrary();
          });
        }

        /* children */
        if (isFolder && node.children) {
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-children' + (node.expanded ? ' is-open' : '');
          renderTree(node.children, childrenContainer, depth + 1);
          row.append(childrenContainer);
        }

        container.append(row);
      });

    function getSelectedLines(containerEl) {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
      const range = sel.getRangeAt(0);
      if (!containerEl.contains(range.commonAncestorContainer)) return null;

      const text = sel.toString().trim();
      if (!text) return null;

      /* try .line spans (code preview) */
      const lines = containerEl.querySelectorAll('.line');
      if (lines.length > 0) {
        let startLine = -1, endLine = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].contains(range.startContainer)) { startLine = i + 1; break; }
        }
        for (let i = lines.length - 1; i >= 0; i--) {
          if (lines[i].contains(range.endContainer)) { endLine = i + 1; break; }
        }
        if (startLine < 0) startLine = 1;
        if (endLine < 0) endLine = lines.length;
        return { text, startLine, endLine, numLines: endLine - startLine + 1, source: 'code' };
      }

      /* plain text (agent response) */
      return { text, startLine: 1, endLine: 1, numLines: 1, source: 'dialog' };
    }

      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (!rect || rect.width === 0) { btn.classList.remove('is-visible'); return; }

      const container = btn.parentElement;
      const containerRect = container.getBoundingClientRect();
      btn.style.top = Math.max(4, rect.top - containerRect.top - 36) + 'px';
      btn.style.left = Math.max(4, rect.left - containerRect.left) + 'px';
      btn.classList.add('is-visible');

        const pre = $('#popupCodePreview');

          const info = getSelectedLines(pre);
          if (info) {
            const lineLabel = 'L' + info.startLine + (info.endLine > info.startLine ? '-' + info.endLine : '');

      if (bytes >= 1_000_000) return `${(bytes / 1_000_000).toFixed(1)} MB`;

    function getFileIcon(type, isImage) {
      if (isImage) {

        md: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2l2 3 2-3h2"></path><path d="M8 17v-3l2 3 2-3v3"></path></svg>',
      };
      return icons[type] || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';

    function addAttachmentChip(file) {
      const chip = document.createElement('div');

    function filterSessions(query) {
      const q = query.toLowerCase().trim();
      sessionItems.forEach((item) => {
        const title = item.querySelector('.session-title')?.textContent?.toLowerCase() || '';
        item.style.display = (!q || title.includes(q)) ? '' : 'none';
      });
      searchClear.style.display = q ? '' : 'none';
    }

    searchInput?.addEventListener('input', () => filterSessions(searchInput.value));

    searchClear?.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      filterSessions('');

    /* persist search on session click — hides bar */
    sessionItems.forEach((item) => {

    function appendMessage(role, html) {
      const article = document.createElement('article');
      article.className = role === 'agent' ? 'message is-agent' : 'message';
      const cardId = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      article.innerHTML =
        `<div class="message-avatar" aria-hidden="true">${role === 'agent' ? 'AI' : '你'}</div>` +
        `<div class="message-card" id="${cardId}">` +
          `<button class="msg-pin-btn" type="button" aria-label="固定此訊息" data-pin-msg="${cardId}">` +
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>` +
          `</button>` +
          html +
        `</div>`;
      messageList.appendChild(article);

      /* wire pin button */
      const pinBtn = article.querySelector('.msg-pin-btn');
      if (pinBtn) {
        pinBtn.addEventListener('click', () => {
          const msgText = article.querySelector('.message-card')?.textContent?.trim() || '';

          currentPin = {

          const pinbar = $('#composerPinbar');

          inner.innerHTML =
            '<div class="pin-tag">' +
              '<div class="pin-tag-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
              '<div class="pin-tag-body">' +

                  '<span class="pin-tag-filename">' + escapeHtml(currentPin.filename) + '</span>' +
                  '<span class="pin-tag-lines">📌 對話</span>' +

                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 12"/></svg>' +

          pinbar.classList.add('is-active');
          window.getSelection()?.removeAllRanges();

    (function wireIntroPin() {

    function updateToolLog() {
      const toolLog = $('#toolLog');
      if (!toolLog) return;
      toolLog.insertAdjacentHTML('afterbegin', '<li class="tool-item"><div class="tool-line"><span>agent.stream</span><span class="mono">running</span></div><span class="mono">已收到使用者訊息，正在模擬 OpenCode delta</span></li>');
    }

    composerForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = promptInput.value.trim();
      const hasAttachments = attachments.some((f) => f !== null);
      if (!value && !hasAttachments) return;

      // build attachment preview for message
      let attachHtml = '';
      const validFiles = attachments.filter((f) => f !== null);
      if (validFiles.length > 0) {
        attachHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">';
        validFiles.forEach((f) => {
          const icon = f.isImage
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
          attachHtml += `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--fg-soft);border-radius:var(--radius-pill);font-size:12px;font-family:var(--font-mono);color:var(--muted);">${icon} ${f.name}</span>`;
        });
        attachHtml += '</div>';
      }

      const msgHtml = attachHtml + (value ? `<p>${value.replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]))}</p>` : '<p class="muted">（已附加檔案）</p>');
      appendMessage('user', msgHtml);
      promptInput.value = '';
      promptInput.style.height = 'auto';

      // clear attachments
      attachPreview.innerHTML = '';
      attachments.length = 0;
      sendButton.disabled = true;
      updateToolLog();

      const agentMessage = appendMessage('agent', '<p class="muted" id="streamingReply">正在建立 agent session，準備將訊息送往 OpenCode 執行器。</p>');
      const reply = '我會先建立 session、附加目前專案上下文，接著把任務交給 opencode-agent。右側面板會同步顯示工具呼叫、執行狀態與需要人工確認的步驟；正式串接時，這裡會改由 API 或 WebSocket 事件即時更新。';
      const target = $('#streamingReply', agentMessage);
      let index = 0;

      // simulate context usage increase over time
      let ctxPct = 72;
      const ctxTimer = window.setInterval(() => {
        ctxPct = Math.min(98, ctxPct + 0.5 + Math.random() * 1.2);
        setContextRing(ctxPct);
        // also bump 5hr token usage
        const used5hr = Math.round(144000 + (ctxPct - 72) * 2000);
        setTokenBar('tokenRow5hr', used5hr, 200000);
        if (ctxPct >= 98) window.clearInterval(ctxTimer);
      }, 1200);

      target.textContent = '';
      const timer = window.setInterval(() => {
        target.textContent += reply[index] || '';
        index += 1;
        if (index >= reply.length) {
          window.clearInterval(timer);
          window.clearInterval(ctxTimer);
          sendButton.disabled = false;
          setContextRing(98);
          setTokenBar('tokenRow5hr', 196000, 200000);
        }
      }, 24);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMobileSurfaces();
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') composerForm.requestSubmit();
    });

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>

          <div class="popup-agent-response" id="popupAgentResponse" hidden="">
            <div class="popup-agent-response-label">📌 編輯建議</div>

          <div class="popup-agent-input-row">
            <textarea class="popup-agent-input" id="popupAgentInput" rows="1" placeholder="輸入編輯指示…例如：幫我重構這個 component" autocomplete="off"></textarea>
            <button class="popup-agent-send" type="button" id="popupAgentSendBtn" aria-label="送出">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>

          </div>
        </div>

        <!-- Shared pin float button for both code preview & dialog -->
        <button class="pin-float-btn" id="pinFloatBtn" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"></path></svg>

    </div>
